name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Run OpenVINO inference integration test
        run: RUN_OPENVINO_INTEGRATION=1 pytest -q tests/test_integration_openvino.py
      - name: Verify non-editable wheel data loading
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/aceu-wheel .
          python -m venv /tmp/aceu-wheel-venv
          /tmp/aceu-wheel-venv/bin/python -m pip install --no-deps /tmp/aceu-wheel/*.whl
          cd /tmp
          ACEU_DATA_DIR="$GITHUB_WORKSPACE/data" /tmp/aceu-wheel-venv/bin/python -c "from aceu_evidence_explorer.data_loader import load_briefs, load_profiles; assert load_profiles() and load_briefs()"
