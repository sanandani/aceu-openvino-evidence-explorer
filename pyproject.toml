[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aceu-openvino-evidence-explorer"
version = "0.1.0"
description = "Synthetic ACE-U evidence explorer demonstrating OpenVINO-backed semantic retrieval."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [{ name = "Shubham Anandani" }]
dependencies = [
  "streamlit==1.45.1",
  "sentence-transformers==5.7.0",
  "openvino==2025.4.1",
  "optimum-intel==1.26.0",
  "transformers==4.55.4",
  "huggingface_hub==0.36.2",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
